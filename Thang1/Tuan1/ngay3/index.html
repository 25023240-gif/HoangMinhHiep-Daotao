<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng kí khóa học</title>
</head>
<body>
    <header>
        <h1> Khóa học vật lý THPT</h1>
    </header>
    <nav>
        <a href = "#thongtinkhoahoc">Thông tin khóa học</a>
        <a href = "#dangky">Đăng ký khóa học</a>
    </nav>
    <main>
        <h2 id = "#thongtinkhoahoc">Thông tin các khóa học cho học sinh THPT</h2>
        <h3><em>1. Combo xuất phát sớm Vật lý 12</em></h3>
        <image src = "assets/image/xps12.jpg" alt = "combo xuất phát sớm lớp 12"></image>
        <h3><em>2. Combo xuát phát sớm Vật lý 11</em></h3>
        <image src = "assets/image/xps11.jpg" alt = "combo xuất phát sớm lớp 11"></image>
        <h3><em>3. Combo xuát phát sớm Vật lý 10</em></h3>
        <image src = "assets/image/xps10.jpg" alt = "combo xuất phát sớm lớp 10L"></image>
        <h2 id = "#dangky">Form đăng ký khóa học</h2>
        <form>
            <label for = "username">Tên đăng nhập: </label>
            <input type = "text" id = "username" name = "user" required>
            <br>
            <br>
            <label for = "password">Mật Khẩu: </label>
            <input type = "password" id = "password" name = "password" minlength = "8" placeholder="Tối thiểu 8 kí tự" required>
            <br>
            <br>
            <label for = "email">Địa chỉ email: </label>
            <input type = "email" id = "email" name = "email" placeholder="abcxyz@gmail.com" required>
            <br>
            <br>
            <label for = "phonenumber">Số điện thoại: </label>
            <input type = "number", id = "phonenumber" name = "phonenumber" required>
            <br>
            <br>
            <label for = "learningcourse">Khóa học</label>
            <select id = "learningcourse" name = "learningcourse">
                <option value = "Chọn khóa học" selected>Chọn khóa học</option>
                <option value = "combo xps 12">Combo xps 12</option>
                <option value = "combo xps 12">Combo xps 11</option>
                <option value = "combo xps 12">Combo xps 10</option>
            </select>
            <br>
            <p>Chế độ học:</p>
            <input type ="radio" id = "learningmode1" name = "learningmode" value = "online">
            <label for = "learningmode1">Online</label>
            <input type ="radio" id = "learningmode2" name = "learningmode" value = "Trực tiếp">
            <label for = "learningmode2">Trực tiếp</label>
            <br>
            <br>
            <label for = "expectation">Nguyện vọng</label>
            <br>
            <textarea id = "expectation" name = "expectation"></textarea>
            <br>
            <br>
            <input type = "submit" value = "Xác nhận đăng ký">
        </form>

    </main>

</body>
</html>
